{% extends "base.html" %}
{% block title %}Sign in | HireHub{% endblock %}
{% block content %}
<section class="auth-wrap container py-5">
  <div class="auth-card mx-auto">
    <p class="eyebrow">Welcome back</p><h1 class="h2 mb-2">Sign in to HireHub</h1>
    <p class="text-secondary mb-4">Pick up where you left off.</p>
    {% if error %}<div class="alert alert-danger" role="alert">{{ error }} Check your details and try again.</div>{% endif %}
    <form method="post" novalidate>
      <div class="mb-3"><label class="form-label" for="email">Email address</label><input class="form-control form-control-lg" type="email" name="email" id="email" value="{{ email or '' }}" required autocomplete="email"></div>
      <div class="mb-4"><label class="form-label" for="password">Password</label><input class="form-control form-control-lg" type="password" name="password" id="password" required autocomplete="current-password"></div>
      <button class="btn btn-primary btn-lg w-100" type="submit">Sign in</button>
    </form>
    <p class="text-center text-secondary mt-4 mb-0">New to HireHub? <a href="{{ url_for('web.register') }}">Create an account</a></p>
  </div>
</section>
{% endblock %}
