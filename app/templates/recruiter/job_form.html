{% extends "base.html" %}
{% block title %}Post a job | HireHub{% endblock %}
{% block content %}
<section class="page-heading"><div class="container"><p class="eyebrow">Recruiter workspace</p><h1 class="h2">Post a job</h1></div></section>
<section class="container py-4"><form method="post" class="section-card form-shell">
  <div class="mb-3"><label class="form-label">Job title</label><input class="form-control" name="title" required maxlength="160"></div>
  <div class="mb-3"><label class="form-label">Description</label><textarea class="form-control" name="description" rows="7" required></textarea></div>
  <div class="row g-3">
    <div class="col-md-6"><label class="form-label">Skills</label><input class="form-control" name="skills" placeholder="Python, SQL, teamwork"></div>
    <div class="col-md-6"><label class="form-label">Location</label><input class="form-control" name="location"></div>
    <div class="col-md-6"><label class="form-label">Work mode</label><select class="form-select" name="work_mode"><option>ONSITE</option><option>HYBRID</option><option>REMOTE</option></select></div>
    <div class="col-md-6"><label class="form-label">Employment type</label><select class="form-select" name="employment_type"><option>FULL_TIME</option><option>PART_TIME</option><option>INTERNSHIP</option><option>CONTRACT</option></select></div>
    <div class="col-md-3"><label class="form-label">Min experience (years)</label><input class="form-control" type="number" step="0.5" min="0" name="experience_min" value="0"></div>
    <div class="col-md-3"><label class="form-label">Max experience (years)</label><input class="form-control" type="number" step="0.5" min="0" name="experience_max" value="0"></div>
    <div class="col-md-3"><label class="form-label">Min salary</label><input class="form-control" type="number" min="0" name="salary_min"></div>
    <div class="col-md-3"><label class="form-label">Max salary</label><input class="form-control" type="number" min="0" name="salary_max"></div>
    <div class="col-md-6"><label class="form-label">Application deadline</label><input class="form-control" type="date" name="deadline"></div>
  </div>
  <button class="btn btn-primary mt-4" type="submit">Publish job</button>
</form></section>
{% endblock %}
